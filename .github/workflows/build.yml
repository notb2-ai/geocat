name: Build GeoCat databases
run-name: "GeoCat · обе базы · ${{ github.event_name }} · #${{ github.run_number }}"
on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      geosite_add:
        description: "Добавить GeoSite: категории через пробел или запятую"
        type: string
        required: false
        default: ""
      geosite_remove:
        description: "Удалить GeoSite: категории через пробел или запятую"
        type: string
        required: false
        default: ""
      geoip_add:
        description: "Добавить GeoIP: категории через пробел или запятую"
        type: string
        required: false
        default: ""
      geoip_remove:
        description: "Удалить GeoIP: категории через пробел или запятую"
        type: string
        required: false
        default: ""
      geocat_domains_add:
        description: "Добавить домены в geocat-ru через пробел или запятую"
        type: string
        required: false
        default: ""
      geocat_domains_remove:
        description: "Удалить ручные домены из geocat-ru через пробел или запятую"
        type: string
        required: false
        default: ""
      force:
        description: "Принудительно скачать и пересобрать обе базы"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/build.yml"
permissions:
  contents: write
concurrency:
  group: geocat-publish
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить актуальный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Проверить сборщик тестами
        run: python3 -m unittest discover -s tests -v -b
      - name: Проверить релиз и собрать обе базы
        id: databases
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          GEOSITE_ADD: ${{ inputs.geosite_add }}
          GEOSITE_REMOVE: ${{ inputs.geosite_remove }}
          GEOIP_ADD: ${{ inputs.geoip_add }}
          GEOIP_REMOVE: ${{ inputs.geoip_remove }}
          GEOCAT_DOMAINS_ADD: ${{ inputs.geocat_domains_add }}
          GEOCAT_DOMAINS_REMOVE: ${{ inputs.geocat_domains_remove }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 -m scripts.build_all --force
          else
            python3 -m scripts.build_all
          fi
      - name: Собрать наборы правил sing-box
        id: sing_box
        env:
          SING_BOX_VERSION: "1.14.4"
          SING_BOX_SHA256: "699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968"
        run: |
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64"
          package="$RUNNER_TEMP/$archive.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/$archive.tar.gz" \
            --output "$package"
          printf '%s  %s\n' "$SING_BOX_SHA256" "$package" | sha256sum --check
          tar -xzf "$package" -C "$RUNNER_TEMP" "$archive/sing-box"
          python3 -m scripts.build_sing_box "$RUNNER_TEMP/$archive/sing-box"
      - name: Опубликовать базы и отчёт
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f geosite.dat geoip.dat STATUS.md README.md metadata/geosite.dat.json metadata/geoip.dat.json metadata/status.json config/geosite-categories.txt config/geoip-categories.txt config/geocat-ru-domains.txt
          git add -A -f -- sing-box/
          if git diff --cached --quiet; then
            echo "Результат уже опубликован."
            exit 0
          fi
          git commit -m "chore: update GeoCat databases and category selection"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Базы и отчёт успешно опубликованы."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Публикация не удалась. Проверь сеть и изменения main; запусти Run workflow заново."
          exit 1
      - name: Показать понятный итог
        if: always()
        env:
          BUILD_RESULT: ${{ steps.databases.outcome }}
          SING_BOX_RESULT: ${{ steps.sing_box.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$SING_BOX_RESULT" = "success" ]; then
            cat STATUS.md >> "$GITHUB_STEP_SUMMARY"
            if [ "$PUBLISH_RESULT" = "success" ]; then
              printf '\n## ✅ Публикация завершена успешно\n' >> "$GITHUB_STEP_SUMMARY"
            else
              printf '\n## ❌ Проверка прошла, но публикация не завершена\nПроверь шаг публикации. Этот запуск нельзя считать успешным обновлением.\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf '# ❌ Проверка GeoCat не завершена\n\nНовые базы этим запуском не опубликованы. Открой красный шаг выше: там причина ошибки. Ранее опубликованный STATUS.md относится к предыдущей успешной проверке.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
