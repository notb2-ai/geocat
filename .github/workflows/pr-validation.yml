name: GeoCat PR validation
run-name: "GeoCat · PR validation · #${{ github.run_number }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR code and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run all existing and new unit tests
        run: python3 -m unittest discover -s tests -v -b

      - name: Check record-level diffs on historical real GeoCat databases
        run: |
          python3 - <<'PY'
          import subprocess
          from scripts.diff_inspector import diff_file, render_diffs

          def historical(commit, name):
              return subprocess.check_output(['git', 'show', f'{commit}:{name}'])

          previous = '0ce6c01315db8d68f260e21e44d2e7b19b8c81e3'
          current = '3598f6c406347a778259cdc39cac37cb42fc04f3'
          older = '799d4ea060126fdfbdec2eb8d7ff5ee62437a626'

          # A binary SHA change can reflect entry reordering, not membership changes.
          reordered = diff_file('geosite.dat',
                               historical(previous, 'geosite.dat'),
                               historical(current, 'geosite.dat'))
          assert reordered['state'] == 'same_rules', reordered
          assert reordered['added'] == reordered['removed'] == 0, reordered

          # A historical GeoCat category-selection update did add 133 rules.
          added = diff_file('geosite.dat',
                          historical(older, 'geosite.dat'),
                          historical(current, 'geosite.dat'))
          assert (added['added'], added['removed']) == (133, 0), added
          assert len(added['categories']) == 1, added
          assert added['categories'][0]['category'] == 'private', added

          # GeoIP remained byte-identical across the two newer snapshots.
          unchanged = diff_file('geoip.dat',
                                historical(previous, 'geoip.dat'),
                                historical(current, 'geoip.dat'))
          assert unchanged['state'] == 'unchanged', unchanged

          with open('/tmp/geocat-diff-validation.md', 'w', encoding='utf-8') as f:
              f.write('# GeoCat Diff Inspector — проверка на реальных данных\n\n')
              f.write('Сравнение двух версий 05–06.11.2026: **только порядок правил**.\n\n')
              f.write('Сравнение ранней версии с текущей: **133 добавленных правила**.\n\n')
              f.write('\n'.join(render_diffs([added])))

          print('PASS: reordering, added category and unchanged GeoIP on real .dat')
          PY
          cat /tmp/geocat-diff-validation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run complete GeoCat build in isolated temporary folder
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/geocat-pr-validation"
          mkdir -p "$stage"
          cp -a README.md geosite.dat geoip.dat metadata config "$stage/"
          python3 -m scripts.build_all --output-dir "$stage" --config-dir "$stage/config"
          printf '\n## Isolated build\n\n✅ Both databases verified in a temporary folder. No commit or push was performed.\n' >> "$GITHUB_STEP_SUMMARY"
